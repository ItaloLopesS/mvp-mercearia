
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Mercearia</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <h1>Controle de Estoque</h1>
        <p>Gerenciamento da mercearia</p>
    </header>

    <main>
        <section>
            <h2>Cadastrar produto</h2>

            <form id="formProduto">
                <input type="text" id="nome" placeholder="Nome do produto" required>
                <input type="number" id="quantidade" placeholder="Quantidade inicial" min="0" required>
                <input type="number" id="preco" placeholder="Preço" min="0" step="0.01" required>
                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section>
            <h2>Movimentar estoque</h2>

            <form id="formMovimentacao">
                <select id="produtoMovimentacao" required>
                    <option value="">Selecione um produto</option>
                </select>

                <input type="number" id="quantidadeMovimentacao" placeholder="Quantidade" min="1" required>

                <button type="button" id="btnEntrada">Registrar entrada</button>
                <button type="button" id="btnSaida">Registrar saída</button>
            </form>
        </section>

        <section>
            <h2>Estoque de produtos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>
            </table>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
